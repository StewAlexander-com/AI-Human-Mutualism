<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" role="img" aria-labelledby="title desc">
  <title id="title">Two partial views, one shared-world check</title>
  <desc id="desc">Human and AI views are partial. Ask, compare, and check against the shared world, then revise, keep, or investigate the answer. Evidence can improve the answer; better knowledge does not guarantee shared values.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a9bcb8"/></marker>
  </defs>
  <rect width="520" height="480" rx="20" fill="#121c25"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="220" height="84" rx="14" fill="#203b3f" stroke="#badbd4" stroke-width="2"/>
    <rect x="276" y="24" width="220" height="84" rx="14" fill="#263747" stroke="#a9c0db" stroke-width="2"/>
    <g fill="#f1eee4" font-size="26" font-weight="700"><text x="134" y="61">Human view</text><text x="386" y="61">AI view</text></g>
    <g fill="#bdc9cf" font-size="24"><text x="134" y="89">partial</text><text x="386" y="89">partial</text></g>
    <g fill="none" stroke="#a9bcb8" stroke-width="2.5" marker-end="url(#arrow)"><path d="M134 108V130H218V153"/><path d="M386 108V130H302V153"/></g>
    <rect x="44" y="158" width="432" height="100" rx="14" fill="#f1eee4"/>
    <text x="260" y="199" fill="#1c2b34" font-size="27" font-weight="700">Ask · compare · check</text>
    <text x="260" y="232" fill="#203b3f" font-size="25">Against the shared world</text>
    <g fill="none" stroke="#a9bcb8" stroke-width="2.5" marker-end="url(#arrow)"><path d="M260 258V280H96V309"/><path d="M260 258V309"/><path d="M260 280H424V309"/></g>
    <g fill="#1c2b34" stroke="#78928b" stroke-width="1.5"><rect x="24" y="314" width="144" height="65" rx="12"/><rect x="188" y="314" width="144" height="65" rx="12"/><rect x="352" y="314" width="144" height="65" rx="12"/></g>
    <g fill="#f1eee4" font-size="25" font-weight="700"><text x="96" y="354">Revise</text><text x="260" y="354">Keep</text><text x="424" y="354">Investigate</text></g>
    <text x="260" y="420" fill="#f1eee4" font-size="25">Evidence can improve the answer.</text>
    <text x="260" y="453" fill="#e2c58a" font-size="25" font-weight="700">Better knowledge ≠ shared values.</text>
  </g>
</svg>
