<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 242" role="img" aria-labelledby="title desc">
  <title id="title">Respect people; weigh claims</title>
  <desc id="desc">Respect for a person does not depend on their usefulness. Confidence in a claim changes with evidence. These are separate judgments, not numeric scores.</desc>
  <rect width="520" height="242" rx="20" fill="#121c25"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="134" y="40" fill="#f1eee4" font-size="26" font-weight="700">Person</text>
    <text x="386" y="40" fill="#f1eee4" font-size="26" font-weight="700">Claim</text>
    <g fill="#1c2b34" stroke-width="3"><circle cx="134" cy="112" r="45" stroke="#badbd4"/><circle cx="386" cy="112" r="45" stroke="#e2c58a"/></g>
    <path d="M134 112V77" stroke="#badbd4" stroke-width="5" stroke-linecap="round"/>
    <path d="M386 112L411 87" stroke="#e2c58a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="134" cy="112" r="6" fill="#badbd4"/><circle cx="386" cy="112" r="6" fill="#e2c58a"/>
    <text x="134" y="191" fill="#badbd4" font-size="26" font-weight="700">Respect</text>
    <text x="386" y="191" fill="#e2c58a" font-size="26" font-weight="700">Evidence</text>
    <text x="260" y="226" fill="#f1eee4" font-size="25">Care and confidence are separate.</text>
  </g>
</svg>
