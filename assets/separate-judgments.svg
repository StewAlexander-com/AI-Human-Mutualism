<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Keep separate judgments separate</title>
  <desc id="desc">Six pairs of judgments, each drawn as two dials that move independently: respect for the person and evidence for the claim; gratitude for time and judgment of substance; ethical worth and epistemic value; knowledge and authority; truth inside the map and truth about the map; difference possessed and difference expressed. One combined knob would hide an error in either.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}.turn{animation:turn 12s ease-in-out infinite}@keyframes turn{0%,17%,100%{transform:rotate(0deg)}8.5%{transform:rotate(-95deg)}}</style>
  <rect width="760" height="340" rx="16" fill="#EDE8DF"/>
  <rect x="16" y="16" width="728" height="308" rx="12" fill="#F7F4EE"/>
  <rect x="36" y="36" width="220" height="118" rx="10" fill="#FFFFFF" stroke="#D0D5DC"/>
  <circle cx="94" cy="82" r="22" fill="#FFFFFF" stroke="#2A6F6A" stroke-width="2.5"/><line x1="94" y1="82" x2="94" y2="66" stroke="#2A6F6A" stroke-width="3" stroke-linecap="round"/><circle cx="94" cy="82" r="4" fill="#2A6F6A"/>
  <circle cx="198" cy="82" r="22" fill="#FFFFFF" stroke="#C45C26" stroke-width="2.5"/><g transform="translate(198 82)"><line class="turn" style="animation-delay:0s" x1="0" y1="0" x2="11" y2="-12" stroke="#C45C26" stroke-width="3" stroke-linecap="round"/></g><circle cx="198" cy="82" r="4" fill="#C45C26"/>
  <text x="94" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2A6F6A">Respect</text><text x="198" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C45C26">Evidence</text>
  <text x="94" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">person</text><text x="198" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">claim</text>
  <text x="146" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#B8C0CA">|</text>
  <rect x="270" y="36" width="220" height="118" rx="10" fill="#FFFFFF" stroke="#D0D5DC"/>
  <circle cx="328" cy="82" r="22" fill="#FFFFFF" stroke="#2A6F6A" stroke-width="2.5"/><line x1="328" y1="82" x2="328" y2="66" stroke="#2A6F6A" stroke-width="3" stroke-linecap="round"/><circle cx="328" cy="82" r="4" fill="#2A6F6A"/>
  <circle cx="432" cy="82" r="22" fill="#FFFFFF" stroke="#C45C26" stroke-width="2.5"/><g transform="translate(432 82)"><line class="turn" style="animation-delay:2s" x1="0" y1="0" x2="11" y2="-12" stroke="#C45C26" stroke-width="3" stroke-linecap="round"/></g><circle cx="432" cy="82" r="4" fill="#C45C26"/>
  <text x="328" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2A6F6A">Time</text><text x="432" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C45C26">Substance</text>
  <text x="328" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">honor it</text><text x="432" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">judge it</text>
  <text x="380" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#B8C0CA">|</text>
  <rect x="504" y="36" width="220" height="118" rx="10" fill="#FFFFFF" stroke="#D0D5DC"/>
  <circle cx="562" cy="82" r="22" fill="#FFFFFF" stroke="#2A6F6A" stroke-width="2.5"/><line x1="562" y1="82" x2="562" y2="66" stroke="#2A6F6A" stroke-width="3" stroke-linecap="round"/><circle cx="562" cy="82" r="4" fill="#2A6F6A"/>
  <circle cx="666" cy="82" r="22" fill="#FFFFFF" stroke="#C45C26" stroke-width="2.5"/><g transform="translate(666 82)"><line class="turn" style="animation-delay:4s" x1="0" y1="0" x2="11" y2="-12" stroke="#C45C26" stroke-width="3" stroke-linecap="round"/></g><circle cx="666" cy="82" r="4" fill="#C45C26"/>
  <text x="562" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2A6F6A">Ethical</text><text x="666" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C45C26">Epistemic</text>
  <text x="562" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">worth of a life</text><text x="666" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">value of a view</text>
  <text x="614" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#B8C0CA">|</text>
  <rect x="36" y="168" width="220" height="118" rx="10" fill="#FFFFFF" stroke="#D0D5DC"/>
  <circle cx="94" cy="214" r="22" fill="#FFFFFF" stroke="#2A6F6A" stroke-width="2.5"/><line x1="94" y1="214" x2="94" y2="198" stroke="#2A6F6A" stroke-width="3" stroke-linecap="round"/><circle cx="94" cy="214" r="4" fill="#2A6F6A"/>
  <circle cx="198" cy="214" r="22" fill="#FFFFFF" stroke="#C45C26" stroke-width="2.5"/><g transform="translate(198 214)"><line class="turn" style="animation-delay:6s" x1="0" y1="0" x2="11" y2="-12" stroke="#C45C26" stroke-width="3" stroke-linecap="round"/></g><circle cx="198" cy="214" r="4" fill="#C45C26"/>
  <text x="94" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2A6F6A">Knowledge</text><text x="198" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C45C26">Authority</text>
  <text x="94" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">flows both ways</text><text x="198" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">stays accountable</text>
  <text x="146" y="219" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#B8C0CA">|</text>
  <rect x="270" y="168" width="220" height="118" rx="10" fill="#FFFFFF" stroke="#D0D5DC"/>
  <circle cx="328" cy="214" r="22" fill="#FFFFFF" stroke="#2A6F6A" stroke-width="2.5"/><line x1="328" y1="214" x2="328" y2="198" stroke="#2A6F6A" stroke-width="3" stroke-linecap="round"/><circle cx="328" cy="214" r="4" fill="#2A6F6A"/>
  <circle cx="432" cy="214" r="22" fill="#FFFFFF" stroke="#C45C26" stroke-width="2.5"/><g transform="translate(432 214)"><line class="turn" style="animation-delay:8s" x1="0" y1="0" x2="11" y2="-12" stroke="#C45C26" stroke-width="3" stroke-linecap="round"/></g><circle cx="432" cy="214" r="4" fill="#C45C26"/>
  <text x="328" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2A6F6A">Inside</text><text x="432" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C45C26">About</text>
  <text x="328" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">the map</text><text x="432" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">the map</text>
  <text x="380" y="219" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#B8C0CA">|</text>
  <rect x="504" y="168" width="220" height="118" rx="10" fill="#FFFFFF" stroke="#D0D5DC"/>
  <circle cx="562" cy="214" r="22" fill="#FFFFFF" stroke="#2A6F6A" stroke-width="2.5"/><line x1="562" y1="214" x2="562" y2="198" stroke="#2A6F6A" stroke-width="3" stroke-linecap="round"/><circle cx="562" cy="214" r="4" fill="#2A6F6A"/>
  <circle cx="666" cy="214" r="22" fill="#FFFFFF" stroke="#C45C26" stroke-width="2.5"/><g transform="translate(666 214)"><line class="turn" style="animation-delay:10s" x1="0" y1="0" x2="11" y2="-12" stroke="#C45C26" stroke-width="3" stroke-linecap="round"/></g><circle cx="666" cy="214" r="4" fill="#C45C26"/>
  <text x="562" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2A6F6A">Possessed</text><text x="666" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C45C26">Expressed</text>
  <text x="562" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">difference held</text><text x="666" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">difference said</text>
  <text x="614" y="219" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#B8C0CA">|</text>
  <text x="380" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1C2430">Turning one dial does not move the other. One knob for both hides an error in either.</text>
</svg>
