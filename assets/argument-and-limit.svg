<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">The argument, and where it stops</title>
  <desc id="desc">Steps 1 to 4 support restraint and preservation. Steps 5 and 6 support a conditional incentive to cooperate. Neither reaches aligned values: a gap marked knowing is not caring separates them, and closing it needs separate work on objectives, training, evaluation, and institutions.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}.gap{animation:g 4s ease-in-out infinite}@keyframes g{0%,100%{opacity:1}50%{opacity:.45}}</style>
  <rect width="760" height="300" rx="16" fill="#EDE8DF"/>
  <rect x="16" y="16" width="728" height="268" rx="12" fill="#F7F4EE"/>
  <rect x="36" y="44" width="200" height="88" rx="10" fill="#FFFFFF" stroke="#2A6F6A" stroke-width="2"/>
  <text x="136" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2A6F6A">Steps 1–4</text>
  <text x="136" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">every map leaves something out</text>
  <text x="136" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">a copy is not the original</text>
  <text x="136" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">harm is not a mandate</text>
  <rect x="36" y="152" width="200" height="88" rx="10" fill="#FFFFFF" stroke="#C45C26" stroke-width="2"/>
  <text x="136" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#C45C26">Steps 5–6</text>
  <text x="136" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">accurate maps are useful</text>
  <text x="136" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">different histories can</text>
  <text x="136" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6573">correct each other</text>
  <path d="M240 88 H284" stroke="#2A6F6A" stroke-width="3" fill="none"/>
  <path d="M280 80 L292 88 L280 96 Z" fill="#2A6F6A"/>
  <path d="M240 196 H284" stroke="#C45C26" stroke-width="3" fill="none"/>
  <path d="M280 188 L292 196 L280 204 Z" fill="#C45C26"/>
  <rect x="298" y="58" width="176" height="60" rx="10" fill="#2A6F6A"/>
  <text x="386" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#F4F1EA">Restraint and</text>
  <text x="386" y="103" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#F4F1EA">preservation</text>
  <rect x="298" y="166" width="176" height="60" rx="10" fill="#C45C26"/>
  <text x="386" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#F4F1EA">A conditional</text>
  <text x="386" y="211" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#F4F1EA">reason to cooperate</text>
  <g class="gap">
    <line x1="510" y1="44" x2="510" y2="240" stroke="#8B2942" stroke-width="2.5" stroke-dasharray="7 6"/>
    <rect x="482" y="128" width="56" height="40" rx="6" fill="#F7F4EE"/>
    <text x="510" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8B2942">knowing</text>
    <text x="510" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8B2942">≠ caring</text>
  </g>
  <rect x="548" y="74" width="176" height="136" rx="10" fill="#1C2430"/>
  <text x="636" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#F4F1EA">Aligned values</text>
  <text x="636" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#B8C0CA">needs separate work:</text>
  <text x="636" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#B8C0CA">objectives, training,</text>
  <text x="636" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#B8C0CA">evaluation, institutions</text>
  <text x="380" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1C2430">Reasons for restraint and cooperation, not a guarantee of care.</text>
</svg>
