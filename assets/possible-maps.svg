<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Space of possible maps</title>
<desc id="desc">One territory, several maps with different coordinate systems, one not yet imagined.</desc>
<rect width="760" height="300" rx="16" fill="#EDE8DF"/>
<rect x="16" y="16" width="728" height="268" rx="12" fill="#F7F4EE"/>
<rect x="40" y="60" width="160" height="150" rx="10" fill="#1C2430"/><text x="120" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#F4F1EA">Territory</text>
<text x="120" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#B8C0CA">larger than any map</text>
<rect x="250" y="60" width="140" height="150" rx="10" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/><line x1="270" y1="80" x2="270" y2="170" stroke="#5A6B7D" stroke-width="1"/><line x1="270" y1="80.0" x2="370" y2="80.0" stroke="#5A6B7D" stroke-width="1"/><line x1="295" y1="80" x2="295" y2="170" stroke="#5A6B7D" stroke-width="1"/><line x1="270" y1="102.5" x2="370" y2="102.5" stroke="#5A6B7D" stroke-width="1"/><line x1="320" y1="80" x2="320" y2="170" stroke="#5A6B7D" stroke-width="1"/><line x1="270" y1="125.0" x2="370" y2="125.0" stroke="#5A6B7D" stroke-width="1"/><line x1="345" y1="80" x2="345" y2="170" stroke="#5A6B7D" stroke-width="1"/><line x1="270" y1="147.5" x2="370" y2="147.5" stroke="#5A6B7D" stroke-width="1"/><line x1="370" y1="80" x2="370" y2="170" stroke="#5A6B7D" stroke-width="1"/><line x1="270" y1="170.0" x2="370" y2="170.0" stroke="#5A6B7D" stroke-width="1"/><text x="320" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6B7D">grid</text>
<rect x="410" y="60" width="140" height="150" rx="10" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/><circle cx="480" cy="125" r="12" fill="none" stroke="#5A6B7D"/><circle cx="480" cy="125" r="26" fill="none" stroke="#5A6B7D"/><circle cx="480" cy="125" r="40" fill="none" stroke="#5A6B7D"/><line x1="480" y1="125" x2="524" y2="125" stroke="#5A6B7D"/><line x1="480" y1="125" x2="502" y2="163" stroke="#5A6B7D"/><line x1="480" y1="125" x2="458" y2="163" stroke="#5A6B7D"/><line x1="480" y1="125" x2="436" y2="125" stroke="#5A6B7D"/><line x1="480" y1="125" x2="458" y2="87" stroke="#5A6B7D"/><line x1="480" y1="125" x2="502" y2="87" stroke="#5A6B7D"/><text x="480" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6B7D">rings</text>
<rect x="570" y="60" width="140" height="150" rx="10" fill="#FFFFFF" stroke="#1C2430" stroke-width="1.2"/><rect x="590" y="80" width="100" height="90" rx="8" fill="#E8D5DA" stroke="#8B2942" stroke-dasharray="5 4"/><text x="640" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#8B2942">?</text>
<text x="640" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6B7D">not yet imagined</text>
<text x="380" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1C2430">Expand the map, and expand the space of possible maps</text>
<text x="380" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5A6B7D">a lost perspective can take an entire coordinate system with it</text>
</svg>
