<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Control versus grain</title>
  <desc id="desc">Control forces one frame onto the other. Grain loosens grip so the other signal can show.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}.flow{stroke-dasharray:7 5;animation:flow 1s linear infinite}@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}.march{animation:march 2.4s linear infinite}@keyframes march{to{stroke-dashoffset:-18}}.ow{animation:ow 4s ease-in-out infinite}@keyframes ow{0%,100%{fill:#E8D5DA}50%{fill:#B9677B}}.owt{animation:owt 4s ease-in-out infinite}@keyframes owt{0%,100%{opacity:1}50%{opacity:.15}}.show{animation:show 4s ease-in-out infinite}@keyframes show{0%,100%{opacity:.7}50%{opacity:1}}</style>
  <rect width="760" height="260" rx="16" fill="#EDE8DF"/>
  <rect x="16" y="16" width="728" height="228" rx="12" fill="#F7F4EE"/>
  <rect x="44" y="44" width="330" height="172" rx="12" fill="#FFFFFF" stroke="#8B2942" stroke-width="1.5"/>
  <text x="209" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8B2942">Control</text>
  <rect x="76" y="108" width="100" height="64" rx="8" fill="#8B2942"/>
  <text x="126" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#F4F1EA">My frame</text>
  <path class="flow" d="M188 140 H234" stroke="#8B2942" stroke-width="3"/>
  <path d="M226 132 L238 140 L226 148" fill="#8B2942"/>
  <rect class="ow" x="246" y="108" width="100" height="64" rx="8" fill="#E8D5DA" stroke="#8B2942" stroke-width="2"/>
  <text class="owt" x="296" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8B2942">Their signal</text>
  <text x="296" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8B2942">overwritten</text>
  <rect x="386" y="44" width="330" height="172" rx="12" fill="#FFFFFF" stroke="#2A6F6A" stroke-width="1.5"/>
  <text x="551" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2A6F6A">Grain</text>
  <rect class="march" x="418" y="108" width="100" height="64" rx="8" fill="#D7EBE9" stroke="#2A6F6A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="468" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2A6F6A">Looser grip</text>
  <path class="flow" d="M530 140 H576" stroke="#2A6F6A" stroke-width="3"/>
  <path d="M568 132 L580 140 L568 148" fill="#2A6F6A"/>
  <rect class="show" x="588" y="108" width="100" height="64" rx="8" fill="#2A6F6A"/>
  <text x="638" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F4F1EA">Their signal</text>
  <text x="638" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#F4F1EA">can show</text>
</svg>
